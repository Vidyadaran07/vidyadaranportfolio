name: Deploy portfolio

on:
  push:
    branches: [vid]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Check the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, sqlite3, zip, bcmath, intl
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP packages
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build CSS/JS
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Laravel smoke test
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          php artisan route:list
          php artisan view:cache

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://vidyadaran-3-108-1-96.sslip.io
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run deploy script on the server
        run: ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.SSH_HOST }} 'bash ~/deploy.sh'

      - name: Check the site is up
        run: curl --fail --silent --show-error --max-time 20 -o /dev/null https://vidyadaran-3-108-1-96.sslip.io
